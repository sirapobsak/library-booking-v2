name: Deploy to GitHub Pages

# รันทุกครั้งที่ push ขึ้น branch main -> build แล้ว deploy ให้อัตโนมัติ
on:
  push:
    branches: [main]
  workflow_dispatch: # กดรันเองได้จากหน้า Actions

permissions:
  contents: read
  pages: write
  id-token: write

# ให้ deploy ทีละงาน ไม่ทับกัน
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # ตั้งค่าใน GitHub repo: Settings > Secrets and variables > Actions
          # ถ้าไม่ตั้ง -> ค่าว่าง -> แอปทำงานแบบ mock อัตโนมัติ
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
